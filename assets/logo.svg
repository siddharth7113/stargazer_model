<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Star Gazer logo">
  <title>Star Gazer</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="55%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <!-- sky -->
  <circle cx="128" cy="128" r="124" fill="url(#sky)" stroke="#2f4a7a" stroke-width="3"/>
  <!-- faint stars -->
  <g fill="#cfe3ff" opacity="0.8">
    <circle cx="52" cy="70" r="1.6"/><circle cx="196" cy="58" r="1.2"/><circle cx="210" cy="150" r="1.4"/>
    <circle cx="70" cy="190" r="1.1"/><circle cx="160" cy="36" r="1.0"/><circle cx="40" cy="128" r="1.3"/>
    <circle cx="178" cy="206" r="1.2"/><circle cx="118" cy="48" r="0.9"/>
  </g>
  <!-- host star with glow -->
  <circle cx="128" cy="104" r="46" fill="url(#star)"/>
  <circle cx="128" cy="104" r="30" fill="#ffd166"/>
  <!-- transiting planet, slightly off-centre to suggest motion -->
  <circle cx="141" cy="104" r="7" fill="#070b16"/>
  <!-- transit light curve: flat, box-shaped dip, flat -->
  <path d="M 44 186 H 100 L 108 204 H 148 L 156 186 H 212" fill="none" stroke="#9ad1ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points along the curve -->
  <g fill="#e6f3ff">
    <circle cx="60" cy="186" r="2.4"/><circle cx="80" cy="186" r="2.4"/><circle cx="118" cy="204" r="2.4"/>
    <circle cx="128" cy="204" r="2.4"/><circle cx="138" cy="204" r="2.4"/><circle cx="176" cy="186" r="2.4"/><circle cx="196" cy="186" r="2.4"/>
  </g>
</svg>
