[project]
name = "stargazer"
version = "0.1.0"
description = "Verifiable exoplanet-finding benchmark and RL environment built on TESS light curves"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "astropy>=6.1",
    "lightkurve>=2.5",
    "batman-package>=2.5",
    "wotan>=1.10",
    "transitleastsquares>=1.0.31",
    "pyyaml>=6.0",
    "setuptools>=70",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
stargazer = "stargazer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stargazer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
