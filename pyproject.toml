[project]
name = "stargazer"
version = "0.1.0"
description = "Verifiable exoplanet-finding benchmark and RL environment built on TESS light curves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "astropy>=6.1",
    "lightkurve>=2.5",
    "batman-package>=2.5",
    "pyyaml>=6.0",
    "setuptools>=70",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "pre-commit>=4"]
openai = ["openai>=1.0"]
view = ["textual>=8"]
tinker = ["tinker", "tinker-cookbook"]
docs = ["sphinx>=8", "myst-parser>=4", "sphinxcontrib-mermaid>=1.0", "furo>=2024.8"]

[project.scripts]
stargazer = "stargazer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stargazer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: tests that cross module boundaries; a unit test must fail first"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "N", "SIM", "RUF", "TID"]
ignore = [
    "D105",  # magic method docstrings
    "D107",  # __init__ docstrings (documented on the class)
    "D205", "D400", "D401", "D415",  # summary-line style rules; numpydoc summaries can be multi-sentence
    "RUF012",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# tests: require a module docstring (D100) and a function docstring (D103); skip class-level rules
"tests/**/*" = ["D101", "D102", "D104", "D105", "D106", "D107"]
"scripts/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
