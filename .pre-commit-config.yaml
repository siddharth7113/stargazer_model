repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-names
        name: no single-letter names
        entry: .venv/bin/python scripts/check_names.py
        language: system
        files: ^stargazer/.*\.py$
      - id: pytest
        name: pytest (offline)
        entry: .venv/bin/python -m pytest -q -W ignore
        language: system
        pass_filenames: false
        always_run: true
